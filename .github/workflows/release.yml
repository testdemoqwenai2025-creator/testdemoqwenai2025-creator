# =============================================================================
# CD Pipeline — Automated Release on Tag Push
# Triggers when a version tag (v*.*.*) is pushed
# Builds standalone binary, signs with GPG & SLSA, creates GitHub Release
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"      # e.g. v8.0.0, v8.1.0
      - "v[0-9]+.[0-9]+.[0-9]+-*"    # e.g. v8.1.0-rc.1

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  NODE_VERSION: "20"
  BUN_VERSION: "1.2.4"

jobs:
  # ── Job 1: Extract Version Metadata ────────────────────────────────────────
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      changelog: ${{ steps.meta.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          
          if [[ "$TAG" == *"-rc."* || "$TAG" == *"-beta."* || "$TAG" == *"-alpha."* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          
          # Generate changelog from last tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --oneline --no-merges 2>/dev/null || echo "Initial release")
          else
            CHANGELOG=$(git log --oneline --no-merges -20)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Version: ${VERSION}"
          echo "Pre-release: $(cat $GITHUB_OUTPUT | grep is_prerelease)"

  # ── Job 2: Build Standalone Binary ─────────────────────────────────────────
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js standalone
        run: bun run build

      - name: Create production start script
        run: |
          cat > .next/standalone/start.sh << 'SCRIPT'
          #!/bin/bash
          PORT="${1:-3000}"
          HOST="${HOST:-0.0.0.0}"
          NODE_ENV="${NODE_ENV:-production}"
          echo "Autonomous Regulatory Compliance Dashboard v${{ needs.prepare.outputs.version }}"
          echo "Listening on http://${HOST}:${PORT}"
          exec node server.js -H "${HOST}" -p "${PORT}"
          SCRIPT
          chmod +x .next/standalone/start.sh

      - name: Package standalone tarball
        id: pack
        run: |
          ARTIFACT_NAME="regulatory-compliance-dashboard-v${{ needs.prepare.outputs.version }}-standalone.tar.gz"
          tar -czf "${ARTIFACT_NAME}" -C .next/standalone .
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "Archive: ${ARTIFACT_NAME}"
          ls -lh "${ARTIFACT_NAME}"

      - name: Generate SHA256 checksum
        run: |
          ARTIFACT_NAME="${{ steps.pack.outputs.artifact_name }}"
          sha256sum "${ARTIFACT_NAME}" > "${ARTIFACT_NAME}.sha256"
          cat "${ARTIFACT_NAME}.sha256"

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: |
            ${{ steps.pack.outputs.artifact_name }}
            ${{ steps.pack.outputs.artifact_name }}.sha256
          retention-days: 5

  # ── Job 3: Sign with GPG ──────────────────────────────────────────────────
  sign-gpg:
    name: GPG Sign
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - name: Download unsigned artifact
        uses: actions/download-artifact@v4
        with:
          name: release-binary

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-keys --with-colons | grep '^fpr' | head -1 | cut -d: -f10)
          echo "GPG_KEY_ID=${GPG_KEY_ID}" >> $GITHUB_ENV

      - name: Sign tarball
        run: |
          ARTIFACT="${{ needs.build.outputs.artifact_name }}"
          gpg --batch --yes --pinentry-mode loopback \
            --detach-sign --armor \
            -u "${GPG_KEY_ID}" \
            "${ARTIFACT}"
          echo "GPG signature created: ${ARTIFACT}.asc"

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-signed
          path: |
            ${{ needs.build.outputs.artifact_name }}
            ${{ needs.build.outputs.artifact_name }}.sha256
            ${{ needs.build.outputs.artifact_name }}.asc
          retention-days: 5

  # ── Job 4: Create GitHub Release ───────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: always() && needs.build.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-binary
          path: ./artifacts

      - name: Try download signed artifacts (may not exist)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-signed
          path: ./artifacts

      - name: Build release notes
        run: |
          cat > RELEASE_NOTES.md << NOTES
          ## Autonomous Regulatory Compliance Dashboard v${{ needs.prepare.outputs.version }}

          ### Changes
          ```
          ${{ needs.prepare.outputs.changelog }}
          ```

          ### Downloads
          | File | Description |
          |------|-------------|
          | `${{ needs.build.outputs.artifact_name }}` | Standalone production build (Node.js 18+) |
          | `${{ needs.build.outputs.artifact_name }}.sha256` | SHA-256 checksum |
          | `${{ needs.build.outputs.artifact_name }}.asc` | GPG signature (if signing key configured) |

          ### Quick Start
          \`\`\`bash
          tar -xzf ${{ needs.build.outputs.artifact_name }}
          cd standalone
          chmod +x start.sh
          ./start.sh 3000
          \`\`\`

          ### Architecture
          - 19 API Routes | 16 Dashboard Tabs | 11 Data Stages
          - 8-State Compliance Machine | 10 Jurisdictional Nodes
          - Pareto-Optimal Strategies | Regulatory Game Theory
          - Full Agent Swarm with Governance Orchestration

          ### License
          MIT License — free for commercial use
          NOTES
          cat RELEASE_NOTES.md

      - name: Collect release assets
        id: assets
        run: |
          ASSETS=""
          for f in artifacts/*; do
            if [ -f "$f" ]; then
              ASSETS="${ASSETS} ${f}"
            fi
          done
          echo "assets=${ASSETS}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ needs.prepare.outputs.version }} — Automated Release"
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          draft: false
          files: ${{ env.assets }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 5: SLSA Provenance (for SLSA Level 3) ─────────────────────────────
  provenance:
    name: SLSA Provenance
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: ${{ needs.build.result == 'success' }}
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-binary

      - name: Generate SLSA provenance
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
        with:
          artifact_path: ${{ needs.build.outputs.artifact_name }}
          provenance_name: "${{ needs.build.outputs.artifact_name }}.intoto.jsonl"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
